[package]
name = "xzbot"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "XzBotCs"
path = "src/main.rs"

[lib]
name = "xzbot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "stream", "json"] }
regex = "1"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
skia-safe = { version = "0.81" }
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"
urlencoding = "2"
zip = "2"
async-trait = "0.1"

[profile.release]
opt-level = 3
